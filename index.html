</style></head><body><div class="preview-banner"><b>PRÉVIA PARA APROVAÇÃO</b> · Teste a agenda e a área da escola. Dados ficam apenas nesta aba e somem ao atualizar. Nenhuma reunião ou mensagem será enviada.</div><header><a href="./" class="logo" aria-label="Langu início">Langu<span>✦</span><small>.space</small></a><nav><a href="#" id="bookingNav" class="active">Agendar uma conversa</a><a href="#escola" id="schoolNav">Área da escola <span>↗</span></a></nav></header><main id="app"></main><div id="toast" role="status" aria-live="polite"></div><footer><span>Langu.space <b>✦</b></span><span>Conexões que abrem novos caminhos.</span><span>Horário de Brasília · UTC−3</span></footer><script>window.LANGU_PREVIEW=true;
(()=>{let records=[],blocks=[],hours=['09:00','10:00','11:00','14:00','15:00','16:00'];

if(p==='/info')return {setup:true,admin:true,hours,automatic:false,publicUrl:location.href.split('#')[0]};
if(p==='/slots'){const d=u.searchParams.get('date');return {slots:!d||[0,6].includes(new Date(d+'T12:00:00').getDay())?[]:hours.filter(t=>Date.parse(d+'T'+t+':00-03:00')>Date.now()&&!records.some(r=>r.date===d&&r.time===t&&r.status!=='rejected')&&!blocks.some(b=>b.date===d&&b.time===t))};}
if(p==='/request'){if(records.some(r=>r.date===data.date&&r.time===data.time&&r.status!=='rejected'))throw Error('Esse horário já foi reservado nesta demonstração.');const id='demo'+Date.now().toString(16);records.unshift({...data,id,status:'pending',created:new Date().toISOString(),delivery:'manual',reason:''});return {id};}
if(p==='/admin/requests')return {requests:records.map(r=>({...r})),blocks:[...blocks]};
if(p==='/admin/decision'){const r=records.find(r=>r.id===data.id);if(!r||r.status!=='pending')throw Error('Solicitação já respondida.');Object.assign(r,{status:data.status,reason:data.reason||''});return {delivery:'manual',message:message(r)};}
if(p==='/admin/message'){const r=records.find(r=>r.id===u.searchParams.get('id'));return {message:message(r),phone:r.phone};}
if(p==='/admin/hours'){if(!data.hours.length||data.hours.some(t=>!/^([01]\d|2[0-3]):(00|30)$/.test(t)))throw Error('Confira os horários informados.');hours=[...new Set(data.hours)].sort();return {ok:true};}

if(p==='/admin/logout'){location.hash='';return {ok:true};}return {ok:true};};})();
const $=s=>document.querySelector(s), app=$('#app');
let info={},selectedDate='',selectedTime='',month=new Date(),step=1,slots=[],requests=[],blocks=[],filter='pending';

month=new Date(today+'T12:00:00');month.setDate(1);

function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',6000)}
function intro(school=false){return `<section class="intro"><div><div class="eyebrow"><i class="dot"></i> ${school?'ESPAÇO DA ESCOLA':'BORA CRIAR UMA CONEXÃO?'}</div><h1>${school?'Sua agenda,<br><em>no seu ritmo.</em>':'Uma boa conversa<br>muda <em>tudo.</em>'}</h1><p>${school?'Acompanhe as solicitações e organize seus próximos encontros.':'Escolha um horário. Conte sua ideia. Vamos conversar.<br>Seu próximo passo começa por aqui.'}</p></div><div class="intro-art" aria-hidden="true">✦<small>✦</small></div></section>`;}

function calendar(){let grid='';const offset=(month.getDay()+6)%7;for(let i=0;i<offset;i++)grid+='<span></span>';const end=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();for(let n=1;n<=end;n++){const d=new Date(month.getFullYear(),month.getMonth(),n),key=iso(d);const enabled=key>=today&&key<=new Date(Date.now()+90*86400000).toISOString().slice(0,10)&&![0,6].includes(d.getDay());grid+=`<button class="day ${enabled?'available':''} ${key===selectedDate?'selected':''}" ${enabled?'':'disabled'} data-date="${key}" aria-label="${fmt(key)}" aria-pressed="${key===selectedDate}">${n}</button>`;}$('#scheduler').innerHTML=steps()+`<div class="calendar-layout"><div class="calendar"><div class="monthline"><h3>${month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3><div class="arrows"><button class="icon-btn" id="prevMonth" aria-label="Mês anterior" ${iso(month).slice(0,7)<=today.slice(0,7)?'disabled':''}>‹</button><button class="icon-btn" id="nextMonth" aria-label="Próximo mês" ${month.getTime()>Date.now()+60*86400000?'disabled':''}>›</button></div></div><div class="week">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${grid}</div><div class="legend"><i class="dot"></i> Selecione uma data para consultar os horários</div></div><div class="times" id="times"></div></div><div class="nextline"><p id="selection">Escolha uma data e um horário<br>para continuar.</p><button class="primary" id="continue" disabled>Continuar <span>→</span></button></div>`;$('#prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);calendar()};$('#nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);calendar()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=async()=>{selectedDate=b.dataset.date;selectedTime='';slots=[];calendar();await loadSlots()});$('#continue').onclick=details;renderTimes();}
function renderTimes(loading=false){$('#times').innerHTML=`<h3>${selectedDate?fmt(selectedDate):'Escolha o seu dia'}</h3><p>${selectedDate?'Horários disponíveis · 30 min':'A conversa começa na agenda.'}</p><div class="slots">${loading?'<span class="muted">Buscando…</span>':slots.map(t=>`<button class="slot ${t===selectedTime?'selected':''}" data-time="${t}" aria-pressed="${t===selectedTime}">${t}</button>`).join('')}</div>${selectedDate&&!slots.length&&!loading?'<p>Sem horários livres neste dia.<br>Que tal escolher outra data?</p>':''}`;document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{selectedTime=b.dataset.time;renderTimes()});$('#continue').disabled=!selectedTime;$('#selection').innerHTML=selectedTime?`<strong>${fmt(selectedDate)} · ${selectedTime}</strong><br>Horário de Brasília`:'Escolha uma data e um horário<br>para continuar.';}
async function loadSlots(){renderTimes(true);const date=selectedDate;try{const r=await api('slots?date='+date);if(date!==selectedDate||step!==1)return;slots=r.slots;renderTimes()}catch(e){toast(e.message);if(step===1)renderTimes()}}
function details(){if(!selectedTime)return;step=2;$('#scheduler').innerHTML=steps()+`<form id="requestForm"><div class="summary">◷ ${fmt(selectedDate)} às ${selectedTime} · 30 minutos · Brasília</div><div class="fields compact-fields"><label>Seu nome<input name="name" autocomplete="name" placeholder="Como podemos chamar você?" required minlength="2" maxlength="100"></label><label>WhatsApp com DDI e DDD<input name="phone" type="tel" autocomplete="tel" placeholder="55 11 99999-9999" required pattern="[+0-9 ()-]{10,24}" maxlength="24"><span class="muted">É por aqui que a escola vai responder.</span></label></div><p class="muted">Nesta demonstração, use dados fictícios. Eles ficam apenas nesta aba e desaparecem ao atualizar a página.</p><div id="formError" class="error" role="alert"></div><div class="form-footer"><button type="button" class="secondary" id="back">← Voltar</button><button class="primary purple" type="submit">Solicitar reunião <span>↗</span></button></div></form>`;$('#back').onclick=()=>{step=1;calendar();loadSlots()};$('#requestForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('[type=submit]');b.disabled=true;$('#formError').textContent='';const d=Object.fromEntries(new FormData(f));d.phone=d.phone.replace(/\D/g,'');try{await api('request',{...d,date:selectedDate,time:selectedTime});step=3;$('#scheduler').innerHTML=steps()+`<div class="success"><div class="check">✦</div><h2>Sua ideia já tem um lugar.</h2><div class="summary">${fmt(selectedDate)} às ${selectedTime} · Brasília</div><p>${window.LANGU_PREVIEW?'Solicitação de demonstração criada nesta aba. Nenhum pedido foi enviado à escola.<br>':'Sua solicitação foi enviada para a escola.<br>'}Na versão final, a escola responderá pelo WhatsApp com a confirmação ou um link para escolher outro horário.</p><p><strong>Demonstração: teste a aprovação na Área da escola.</strong></p><button class="secondary" id="newRequest">Voltar para a agenda</button></div>`;$('#newRequest').onclick=()=>{selectedTime='';selectedDate='';slots=[];booking()}}catch(err){$('#formError').textContent=err.message;b.disabled=false}};}
async function school(){try{info=await api('info');$('#schoolNav').classList.add('active');$('#bookingNav').classList.remove('active');if(!info.admin){app.innerHTML=intro(true)+`<div class="login"><form id="login"><div class="eyebrow">✦ ACESSO RESTRITO</div><h2>${info.setup?'Olá, equipe Langu.':'Crie o acesso da escola.'}</h2><p class="muted">${info.setup?'Entre para acompanhar os pedidos de reunião.':'Defina uma senha com pelo menos 10 caracteres. Guarde-a com a equipe responsável pela agenda.'}</p><label>Senha da escola<input type="password" name="password" autocomplete="${info.setup?'current-password':'new-password'}" minlength="${info.setup?1:10}" maxlength="128" required></label><div class="error" id="loginError" role="alert"></div><button class="primary purple">${info.setup?'Entrar no painel':'Criar acesso e entrar'} →</button></form></div>`;$('#login').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{const password=new FormData(f).get('password');if(!info.setup){await api('setup',{password});info.setup=true}await api('login',{password});await school()}catch(err){$('#loginError').textContent=err.message;b.disabled=false}};return}const r=await api('admin/requests');requests=r.requests;blocks=r.blocks;dashboard()}catch(e){toast(e.message)}}
function dashboard(){const counts=s=>requests.filter(r=>r.status===s).length;app.innerHTML=intro(true)+`<div class="banner">${info.automatic?'✦ Envio automático conectado. Confira em cada solicitação se a mensagem foi encaminhada à integração.':'✦ Demonstração do painel: teste a aprovação e veja a prévia da mensagem de resposta.'}${window.LANGU_PREVIEW?'<br>Esta é uma demonstração: solicitações ficam apenas nesta aba, sem envio de mensagens.':''}${!info.publicUrl?'<br>Antes de compartilhar a agenda, configure o endereço público. O link de remarcação atual abre apenas neste computador.':''}</div><div class="stats"><div class="stat">Aguardando resposta<b>${counts('pending')}</b></div><div class="stat">Confirmadas<b>${counts('accepted')}</b></div><div class="stat">Remarcação solicitada<b>${counts('rejected')}</b></div></div><div class="toolbar">${[['pending','Pendentes'],['accepted','Confirmadas'],['rejected','Remarcar'],['all','Todas']].map(([k,n])=>`<button class="secondary ${k===filter?'active':''}" data-filter="${k}">${n}</button>`).join('')}<button class="secondary" id="refresh">↻ Atualizar</button><button class="secondary" id="logout">Sair</button></div><section id="requests"></section><details class="settings"><summary>Horários e disponibilidade</summary><p class="muted">De segunda a sexta, pelos próximos 90 dias. Cada reunião dura 30 minutos. Horários ocupados ficam reservados; use bloqueios para feriados e outros compromissos.</p><form id="hoursForm"><label>Horários de início (separados por vírgula)<input name="hours" value="${esc(info.hours.join(', '))}" required></label><p class="muted">Exemplo: 09:00, 09:30, 10:00, 14:00, 15:00.</p><button class="secondary">Salvar horários</button></form><form id="blockForm"><div class="fields"><label>Bloquear uma data<input type="date" name="date" min="${today}" required></label><label>Horário<select name="time">${info.hours.map(t=>`<option>${t}</option>`).join('')}</select></label></div><button class="secondary block-button">Bloquear horário</button></form><div>${blocks.map((b,i)=>`<div class="block-row"><span>${fmt(b.date)} · ${esc(b.time)}</span><button class="secondary" data-unblock="${i}">Desbloquear</button></div>`).join('')}</div></details>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;dashboard()});$('#refresh').onclick=school;$('#logout').onclick=async()=>{await api('admin/logout',{});school()};$('#hoursForm').onsubmit=async e=>{e.preventDefault();try{await api('admin/hours',{hours:new FormData(e.currentTarget).get('hours').split(',').map(s=>s.trim())});toast('Horários salvos.');school()}catch(err){toast(err.message)}};$('#blockForm').onsubmit=async e=>{e.preventDefault();try{await api('admin/block',Object.fromEntries(new FormData(e.currentTarget)));toast('Horário bloqueado.');school()}catch(err){toast(err.message)}};document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{try{await api('admin/block',{...blocks[Number(b.dataset.unblock)],remove:true});school()}catch(err){toast(err.message)}});renderRequests();}
const statusName={pending:'Aguardando aprovação',accepted:'Confirmada',rejected:'Remarcar'};
function renderRequests(){const list=requests.filter(r=>filter==='all'||r.status===filter);$('#requests').innerHTML=list.length?list.map(r=>`<article class="request"><div class="request-top"><div><h3>${esc(r.name)}</h3><div class="muted">+${esc(r.phone)}<br>${fmt(r.date)} · ${esc(r.time)} · Brasília</div></div><span class="badge ${r.status}">${statusName[r.status]}</span></div>${r.subject?`<p>${esc(r.subject)}</p>`:``}${r.status==='pending'?`<label>Observação para pedir outro horário (opcional)<input id="reason-${r.id}" maxlength="500" placeholder="Ex.: nossa equipe estará em um evento nesse dia."></label><div class="request-actions"><button class="primary purple" data-decision="accepted" data-id="${r.id}">Aceitar reunião ✓</button><button class="secondary" data-decision="rejected" data-id="${r.id}">Pedir novo horário ↗</button></div>`:`${r.reason?`<p class="muted">${esc(r.reason)}</p>`:''}<div class="request-actions"><button class="secondary" data-message="${r.id}">Ver prévia da mensagem ↗</button><span class="muted">${r.delivery==='submitted'?'Encaminhada à integração · entrega não verificada':r.delivery==='failed'?'Falha no envio automático · envie manualmente':'Mensagem simulada'}</span></div><div id="message-${r.id}"></div>`}</article>`).join(''):'<div class="empty">Tudo em dia por aqui. ✦<p class="muted">Nenhuma solicitação nesta categoria.</p></div>';document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{const buttons=b.closest('.request').querySelectorAll('button');buttons.forEach(x=>x.disabled=true);try{const r=await api('admin/decision',{id:b.dataset.id,status:b.dataset.decision,reason:$('#reason-'+b.dataset.id).value});toast(r.delivery==='submitted'?'Resposta salva e encaminhada à integração.':'Resposta simulada. Confira a prévia da mensagem.');const id=b.dataset.id;await school();if(filter!=='all'){filter=b.dataset.decision;dashboard()}showMessage(id)}catch(e){toast(e.message);buttons.forEach(x=>x.disabled=false)}});document.querySelectorAll('[data-message]').forEach(b=>b.onclick=()=>showMessage(b.dataset.message));}
async function showMessage(id){if(window.LANGU_PREVIEW){const r=await api('admin/message?id='+id),el=$('#message-'+id);if(el)el.innerHTML=`<div class="summary message-text">${esc(r.message)}</div><p class="muted">Prévia da mensagem. Nenhum WhatsApp será enviado nesta demonstração.</p>`;return;}try{const r=await api('admin/message?id='+id),el=$('#message-'+id);if(!el)return;el.innerHTML=`<div class="summary message-text">${esc(r.message)}</div><a class="primary whatsapp-link" href="https://wa.me/${r.phone}?text=${encodeURIComponent(r.message)}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp ↗</a><p class="muted">Revise a mensagem e toque em enviar no WhatsApp.</p>`}catch(e){toast(e.message)}}
$('#schoolNav').onclick=()=>{location.hash='escola'};$('#bookingNav').onclick=()=>{location.hash=''};window.addEventListener('hashchange',()=>location.hash==='#escola'?school():booking());
(async()=>{try{info=await api('info');if(location.hash==='#escola')await school();else booking()}catch(e){app.innerHTML='<p class="error">Não foi possível conectar à agenda. Confirme que o site está aberto pelo iniciador e atualize a página.</p>'}})();
</script></body></html>
